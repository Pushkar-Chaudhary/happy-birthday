<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    color: white;
    height: 100vh;
    background: linear-gradient(135deg, #2a0845 0%, #6441A5 100%);
    touch-action: manipulation;
  }

  /* Canvas */
  #canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
  }

  /* Start Overlay */
  #intro-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: pointer;
  }

  .start-btn {
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    border: none;
    padding: 20px 60px;
    color: white;
    font-size: 1.5rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
    font-family: 'Poppins', sans-serif;
    transition: transform 0.3s;
  }
  .start-btn:hover {
    transform: scale(1.05);
  }

  /* Text Container (Left side on desktop) */
  #text-container {
    position: absolute;
    top: 45%;
    left: 8%;
    transform: translateY(-50%);
    width: 35%;
    max-width: 450px;
    text-align: left;
    z-index: 10;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    pointer-events: none;
  }

  #text { font-size: 1.4rem; line-height: 1.6; font-weight: 300; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
  .highlight { font-family: 'Sacramento', cursive; color: #ff9ff3; font-size: 2.2rem; font-weight: 600; text-shadow: 0 0 15px rgba(255, 154, 243, 0.6); }

  /* Hints */
  #hint {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
    font-size: 1.1rem;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    padding: 15px 0;
    pointer-events: none;
    color: #fff;
    font-weight: 500;
    transition: background 0.3s;
  }

  /* Knife */
  #knife {
    position: absolute;
    font-size: 4rem;
    display: none;
    z-index: 30;
    cursor: grab;
    user-select: none;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
  }

  /* Wish Container (beside cake, right side) */
  #wish-container {
    position: absolute;
    right: 8%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    opacity: 0;
    transition: opacity 1s ease-in;
    animation: float 3s ease-in-out infinite;
  }

  .wish-btn {
    background: linear-gradient(135deg, #e056fd, #be2edd);
    border: none;
    padding: 15px 35px;
    color: white;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(190, 46, 221, 0.5);
    font-family: 'Poppins', sans-serif;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .wish-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(190, 46, 221, 0.7);
  }

  @keyframes float {
    0%, 100% { transform: translateY(-50%); }
    50% { transform: translateY(-55%); }
  }

  /* Modal */
  #wish-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .modal-content {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 40px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 1.5rem;
    cursor: pointer;
    color: #ccc;
    transition: color 0.3s;
  }
  
  .close-btn:hover { color: white; }

  .modal-content h2 {
    margin-bottom: 20px;
    font-family: 'Sacramento', cursive;
    font-size: 3rem;
    color: #ff9ff3;
  }

  .modal-content textarea {
    width: 100%;
    height: 120px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    padding: 15px;
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    resize: none;
    margin-bottom: 20px;
  }
  .modal-content textarea:focus {
    outline: none;
    border-color: #e056fd;
    background: rgba(0,0,0,0.3);
  }

  .submit-wish-btn {
    background: #ff9ff3;
    color: #2a0845;
    border: none;
    padding: 15px 40px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .submit-wish-btn:hover {
    background: white;
    transform: scale(1.05);
  }

  @media (max-width: 768px) {
    #text-container {
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      justify-content: center;
      padding: 15px;
    }
    #text { font-size: 1.1rem; line-height: 1.5; }
    .highlight { font-size: 1.6rem; }
    #hint { font-size: 0.85rem; }
    
    #wish-container {
      right: 50%;
      top: auto;
      bottom: 2%;
      transform: translateX(50%);
      animation: float-mobile 3s ease-in-out infinite;
    }
    @keyframes float-mobile {
      0%, 100% { transform: translateX(50%) translateY(0); }
      50% { transform: translateX(50%) translateY(-10px); }
    }
    .modal-content {
      padding: 25px;
      width: 95%;
    }
    .modal-content h2 {
      font-size: 2.2rem;
    }
    #knife {
      font-size: 3rem;
    }
  }
</style>
</head>
<body>

<!-- OVERLAY -->
<div id="intro-overlay" onclick="startCelebration()">
  <h1 style="margin-bottom: 30px; font-weight: 300; font-size: 2.5rem; color: #fff; font-family: 'Sacramento', cursive;">Happy Birthday!</h1>
  <button class="start-btn">Enter Party 🎉</button>
  <p style="margin-top: 20px; color: #ccc; font-size: 0.9rem;">(Please allow microphone access to blow candles!)</p>
</div>

<!-- CANVAS -->
<canvas id="canvas"></canvas>

<!-- TEXT -->
<div id="text-container">
  <div id="text"></div>
</div>

<!-- HINT -->
<div id="hint">🎤 Blow into the microphone!</div>

<!-- KNIFE -->
<div id="knife">🔪</div>

<!-- WISH CONTAINER -->
<div id="wish-container">
  <button class="wish-btn" onclick="openWishModal()">Make a Wish ✨</button>
</div>

<!-- WISH MODAL -->
<div id="wish-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeWishModal()">&times;</span>
    <h2>Make Your Wish</h2>
    <form id="wish-form" onsubmit="sendWish(event)">
      <input type="text" id="wish-name" placeholder="Your Name" required style="width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: white; font-family: 'Poppins', sans-serif; box-sizing: border-box; outline: none;">
      <input type="email" id="wish-email" placeholder="Recipient's Gmail Address" required style="width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: white; font-family: 'Poppins', sans-serif; box-sizing: border-box; outline: none;">
      <textarea id="wish-input" name="wish" placeholder="Type your beautiful wish here..." required></textarea>
      <button type="submit" class="submit-wish-btn">Send Wish 💌</button>
    </form>
  </div>
</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="aud.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== VARIABLES ===== */
let canvas, ctx, width, height, scale;
let audio, textEl, hintEl, overlay;
let state = {
  started: false,
  candlesBlown: false,
  cakeCut: false,
  landed: [false, false, false]
};

// Layer independent logic (Base, Mid, Top)
let layerY = [-1000, -1000, -1000];
let layerVel = [0, 0, 0];

/* ===== INITIALIZATION ===== */
window.onload = function() {
  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");
  audio = document.getElementById("music");
  textEl = document.getElementById("text");
  hintEl = document.getElementById("hint");
  overlay = document.getElementById("intro-overlay");
  
  resize();
  partyHat.x = width < 768 ? width/2 - 120*scale : width/2 - 250*scale;
  partyHat.y = height - 60*scale;
  
  cats.push(new Cat());
  stickmen.push(new Stickman(width/2 + 200*scale));
  stickmen.push(new Stickman(width/2 - 200*scale));
  initGifts();

  window.addEventListener("resize", resize);
  initKnifeDrag();
  initHatDrag();
};

function resize() {
  width = canvas.width = innerWidth;
  height = canvas.height = innerHeight;
  scale = Math.min(width / 800, 1);
  initCandles();
}

/* ===== MAIN START FUNCTION ===== */
function startCelebration() {
  overlay.style.display = "none";

  // Start music immediately at an audible volume, then fade up smoothly
  audio.volume = 0.3;
  audio.play().then(() => {
    let v = 0.3;
    const fade = setInterval(() => {
      v += 0.05;
      audio.volume = Math.min(v, 1);
      if (v >= 1) clearInterval(fade);
    }, 80);
  }).catch(e => console.log("Audio play failed", e));

  state.started = true;
  startTypewriter();
  animate();
  initMicrophone();
}

/* ===== MODAL LOGIC ===== */
function openWishModal() {
  const modal = document.getElementById('wish-modal');
  modal.style.display = 'flex';
  setTimeout(() => modal.style.opacity = '1', 10);
}

function closeWishModal() {
  const modal = document.getElementById('wish-modal');
  modal.style.opacity = '0';
  setTimeout(() => modal.style.display = 'none', 300);
}

function sendWish(e) {
  e.preventDefault();
  const wishName = document.getElementById("wish-name").value.trim();
  const wishEmail = document.getElementById("wish-email").value.trim();
  const wishText = document.getElementById("wish-input").value;
  
  const email = wishEmail || "pushkarchaudhary256@gmail.com";
  const subject = encodeURIComponent(`New Birthday Wish from ${wishName}`);
  const body = encodeURIComponent(wishText);

  // Detect mobile device
  const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

  // Create a hidden anchor and click it — this works on mobile (treated as direct user gesture)
  const link = document.createElement('a');

  if (isMobile) {
    // mailto: is the most reliable on mobile — OS routes it to the default mail/Gmail app
    link.href = `mailto:${email}?subject=${subject}&body=${body}`;
  } else {
    // On desktop, open Gmail compose in a new tab
    link.href = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  }

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  closeWishModal();
  hintEl.innerHTML = "Wish prepared! Opening Gmail to send it. ✨";
  hintEl.style.background = "rgba(76,175,80,0.7)";
}

/* ===== MICROPHONE LOGIC ===== */
function initMicrophone() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    hintEl.innerText = "Microphone access is needed to blow candles! 🎤";
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();

      // Desktop browsers start AudioContext in 'suspended' state — must resume it explicitly
      // (mobile browsers auto-resume after a user gesture, but desktop doesn't always)
      const startDetection = () => {
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        let volumeHistory = [];

        function detectSound() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
          }
          let average = sum / bufferLength;

          volumeHistory.push(average);
          if (volumeHistory.length > 20) volumeHistory.shift();

          let averageHistory = volumeHistory.reduce((a, b) => a + b) / volumeHistory.length;

          // Relaxed thresholds: spike of +12 over baseline (was +20), min volume of 10 (was 15)
          // Laptop mics have more ambient noise that raises the baseline, so a lower delta works better
          if (average > averageHistory + 12 && average > 10) {
            blowCandles();
          }

          requestAnimationFrame(detectSound);
        }
        detectSound();
      };

      if (audioContext.state === 'suspended') {
        audioContext.resume().then(startDetection);
      } else {
        startDetection();
      }
    })
    .catch(err => {
      console.log("Microphone access denied or error:", err);
      hintEl.innerText = "Please allow microphone access to blow candles! 🎤";
    });
}

/* ===== TYPEWRITER ===== */
const lines = [
  "Happy Birthday <span class='highlight'>Goluuu</span> 🎂🎈",
  "My <span class='highlight'>Love</span> 🎀💞",
  "May God bless you 🙏🍀",
  "And give you endless happiness 💕",
  "I love you ❤️",
  "And will always love you 💐❤️"
];
let l = 0, c = 0;
function startTypewriter() {
  setTimeout(typeWriter, 1000);
}
function typeWriter() {
  if (l < lines.length) {
    if (lines[l].charAt(c) === '<') {
      let tag = '';
      while (lines[l].charAt(c) !== '>' && c < lines[l].length) {
        tag += lines[l].charAt(c);
        c++;
      }
      tag += '>';
      c++;
      textEl.innerHTML += tag;
      setTimeout(typeWriter, 10); 
    } else if (c < lines[l].length) {
      textEl.innerHTML += lines[l][c++];
      setTimeout(typeWriter, 60);
    } else {
      textEl.innerHTML += "<br>";
      c = 0;
      l++;
      setTimeout(typeWriter, 800);
    }
  }
}

/* ===== DRAWING LOGIC ===== */
let candles = [];
let confetti = [];
let smoke = [];
let sparkles = [];
let hearts = [];
let balloons = [];
let partyHat = { x: 0, y: 0, scale: 1, isDragging: false, wearer: null };
let cats = [];
let stickmen = [];

function initCandles() {
  candles = [];
  const spacing = 24 * scale;
  const cx = width / 2;
  for(let i=0; i<6; i++) {
    candles.push({
      x: cx - ((6-1)*spacing)/2 + i*spacing,
      lit: true
    });
  }
}

function drawFullCakeElements(cx, cy, s) {
  const baseActualY = cy + layerY[0];
  const midActualY = cy - 50*s + layerY[1];
  const topActualY = cy - 90*s + layerY[2];

  // Base Layer
  ctx.fillStyle = '#ff9a9e';
  ctx.fillRect(cx - 90*s, baseActualY, 180*s, 80*s);
  
  // Middle Layer
  ctx.fillStyle = '#fecaca';
  ctx.fillRect(cx - 75*s, midActualY, 150*s, 60*s);
  ctx.fillStyle = '#fff0f5'; // Icing
  ctx.fillRect(cx - 75*s, midActualY, 150*s, 15*s);
  // Middle Drips
  ctx.beginPath();
  ctx.moveTo(cx - 75*s, midActualY + 15*s);
  ctx.lineTo(cx + 75*s, midActualY + 15*s);
  for(let i=0; i<5; i++) {
    ctx.quadraticCurveTo(cx-70*s+(i*30*s), midActualY+30*s, cx-65*s+(i*30*s), midActualY+15*s);
  }
  ctx.fill();

  // Top Layer
  ctx.fillStyle = '#fad0c4';
  ctx.fillRect(cx - 60*s, topActualY, 120*s, 50*s);

  // Candles
  candles.forEach(c => {
    const cY = topActualY;
    ctx.fillStyle = '#fff';
    ctx.fillRect(c.x - 3*s, cY - 25*s, 6*s, 25*s);
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(c.x - 3*s, cY - 15*s, 6*s, 5*s);

    if (c.lit) {
      ctx.fillStyle = '#333';
      ctx.fillRect(c.x - 1*s, cY - 27*s, 2*s, 4*s);

      const time = Date.now();
      const flicker = Math.sin(time / 80 + c.x) * 2 * s + Math.random() * s;
      const flameHeight = 24 * s + flicker; 
      const flameWidth = 6 * s + Math.random() * s;

      ctx.save();
      ctx.shadowBlur = 15 * s;
      ctx.shadowColor = '#ff6a00';

      const grad = ctx.createRadialGradient(
          c.x, cY - 27*s - flameHeight * 0.2, 0, 
          c.x, cY - 27*s - flameHeight * 0.2, flameHeight * 0.7
      );
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 255, 0, 1)');
      grad.addColorStop(0.7, 'rgba(255, 120, 0, 1)');
      grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
      
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.moveTo(c.x, cY - 27*s);
      ctx.bezierCurveTo(
        c.x + flameWidth, cY - 27*s, 
        c.x + flameWidth * 0.7, cY - 27*s - flameHeight * 0.6, 
        c.x, cY - 27*s - flameHeight
      );
      ctx.bezierCurveTo(
        c.x - flameWidth * 0.7, cY - 27*s - flameHeight * 0.6, 
        c.x - flameWidth, cY - 27*s, 
        c.x, cY - 27*s
      );
      ctx.fill();
      
      // Draw inner bright core
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.moveTo(c.x, cY - 27*s);
      ctx.bezierCurveTo(
        c.x + flameWidth * 0.4, cY - 27*s, 
        c.x + flameWidth * 0.3, cY - 27*s - flameHeight * 0.3, 
        c.x, cY - 27*s - flameHeight * 0.5
      );
      ctx.bezierCurveTo(
        c.x - flameWidth * 0.3, cY - 27*s - flameHeight * 0.3, 
        c.x - flameWidth * 0.4, cY - 27*s, 
        c.x, cY - 27*s
      );
      ctx.fill();
      
      ctx.restore();
    }
  });

}

function drawCake() {
  const cx = width/2;
  const cy = width < 768 ? height * 0.65 : height * 0.68;
  const s = scale;

  drawTable(cx, cy, s);

  // Step-wise drop animation
  if (!state.landed[0]) {
    layerVel[0] += 1.5; layerY[0] += layerVel[0];
    if (layerY[0] >= 0) { layerY[0] = 0; layerVel[0] *= -0.4; if (Math.abs(layerVel[0]) < 1.5) state.landed[0] = true; }
  } else if (!state.landed[1]) {
    layerVel[1] += 1.5; layerY[1] += layerVel[1];
    if (layerY[1] >= 0) { layerY[1] = 0; layerVel[1] *= -0.4; if (Math.abs(layerVel[1]) < 1.5) state.landed[1] = true; }
  } else if (!state.landed[2]) {
    layerVel[2] += 1.5; layerY[2] += layerVel[2];
    if (layerY[2] >= 0) { layerY[2] = 0; layerVel[2] *= -0.4; if (Math.abs(layerVel[2]) < 1.5) state.landed[2] = true; }
  }

  // Left Half
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, cx, height);
  ctx.clip();
  drawFullCakeElements(cx, cy, s);
  ctx.restore();

  // Sponge filling when cut
  if (state.cakeCut) {
    ctx.fillStyle = '#ffdfba'; 
    ctx.fillRect(cx - 2*s, cy - 90*s, 3*s, 170*s); 
    ctx.fillRect(cx + 30*s, cy - 90*s + 10*s, 4*s, 170*s); 
  }

  // Right Half (Shifted if cut)
  ctx.save();
  if (state.cakeCut) {
    ctx.translate(30*s, 10*s);
  }
  ctx.beginPath();
  ctx.rect(cx, -height, width, height*3);
  ctx.clip();
  drawFullCakeElements(cx, cy, s);
  ctx.restore();
}

/* ===== PARTICLES ===== */
class Particle {
  constructor(type, x, y) {
    this.type = type;
    this.x = x || Math.random()*width;
    this.y = y || height + 30;
    this.vx = (Math.random()-0.5)*4;
    this.vy = (Math.random()*-2) - 1;
    this.size = Math.random()*5 + 2;
    this.life = 100;
    
    if (type === 'popper-left') {
      this.x = Math.random() * 50;
      this.y = -20;
      this.vx = Math.random()*15 + 5;
      this.vy = Math.random()*15 - 2;
      this.color = `hsl(${Math.random()*360},100%,60%)`;
      this.type = 'confetti';
    } else if (type === 'popper-right') {
      this.x = width - Math.random() * 50;
      this.y = -20;
      this.vx = -Math.random()*15 - 5;
      this.vy = Math.random()*15 - 2;
      this.color = `hsl(${Math.random()*360},100%,60%)`;
      this.type = 'confetti';
    } else if (type === 'heart') {
      this.v = Math.random()*1.5+0.5;
      this.color = 'pink';
    } else if (type === 'balloon') {
      this.x = Math.random() * width;
      this.y = height + 50 + Math.random() * 100;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = -Math.random() * 1.5 - 0.5;
      this.size = (Math.random() * 15 + 20) * scale;
      this.color = `hsl(${Math.random()*360}, 80%, 60%)`;
      this.stringLen = (Math.random() * 20 + 30) * scale;
    }
  }
  update() {
    this.x += this.vx;
    if(this.type === 'heart') {
      this.y -= this.v;
    } else if (this.type === 'smoke') {
      this.y += this.vy;
      this.size += 0.2;
      this.life -= 2;
      this.vy = -1.5;
      this.vx *= 0.95; 
    } else if (this.type === 'confetti') {
      this.y += this.vy;
      this.vy += 0.2; // gravity
      if(this.y > height) this.life = 0;
    } else if (this.type === 'balloon') {
      this.y += this.vy;
      // wobble
      this.vx += (Math.random() - 0.5) * 0.05;
      if (this.vx > 1) this.vx = 1;
      if (this.vx < -1) this.vx = -1;
      if (this.y < -this.size - this.stringLen) this.life = 0;
    }
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    if(this.type === 'confetti') {
      ctx.fillRect(this.x, this.y, this.size, this.size);
    } else if (this.type === 'heart') {
      ctx.moveTo(this.x, this.y);
      ctx.bezierCurveTo(this.x-10, this.y-10, this.x-25, this.y+10, this.x, this.y+25);
      ctx.bezierCurveTo(this.x+25, this.y+10, this.x+10, this.y-10, this.x, this.y);
    } else if (this.type === 'smoke') {
      ctx.fillStyle = `rgba(220, 220, 220, ${Math.max(0, this.life / 100)})`;
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    } else if (this.type === 'balloon') {
      // String
      ctx.beginPath();
      ctx.moveTo(this.x, this.y + this.size);
      ctx.lineTo(this.x + this.vx*5, this.y + this.size + this.stringLen);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      // Balloon body
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, this.size * 0.85, this.size, 0, 0, Math.PI*2);
      ctx.fill();
      
      // Balloon highlight
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.ellipse(this.x - this.size*0.3, this.y - this.size*0.4, this.size*0.15, this.size*0.3, Math.PI/8, 0, Math.PI*2);
      ctx.fill();
      
      // Little knot
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y + this.size);
      ctx.lineTo(this.x - 3, this.y + this.size + 4);
      ctx.lineTo(this.x + 3, this.y + this.size + 4);
      ctx.fill();
      return;
    }
    ctx.fill();
  }
}

/* ===== CELEBRATION LOGIC ===== */
function blowCandles() {
  if (!state.started || state.candlesBlown || !state.landed[2]) return;
  
  state.candlesBlown = true;
  hintEl.innerHTML = "Yay! 🎉 Happy Birthday!";
  hintEl.style.background = "rgba(76,175,80,0.5)";

  const cy = width < 768 ? height * 0.65 : height * 0.68;
  const topActualY = cy - 90*scale + layerY[2];

  // Smoke from candles
  candles.forEach(c => {
    if(c.lit) {
      c.lit = false;
      for(let k=0; k<15; k++) {
        smoke.push(new Particle('smoke', c.x, topActualY - 25*scale)); 
      }
    }
  });

  // Party Poppers
  setTimeout(() => {
    for(let i=0; i<150; i++) {
      confetti.push(new Particle('popper-left'));
      confetti.push(new Particle('popper-right'));
    }
  }, 1000);

  // Present Knife
  setTimeout(() => {
    hintEl.innerHTML = "Drag the knife down the cake to cut it! 🔪";
    const knife = document.getElementById('knife');
    knife.style.display = 'block';
    
    // Force reflow
    void knife.offsetWidth;
    
    knife.style.transition = 'top 0.4s ease-in, left 0.4s ease-in, transform 0.4s ease-in, opacity 0.4s ease-out';
    knife.style.opacity = '1';
    knife.style.left = '50%';
    knife.style.top = '85%';
    knife.style.transform = 'translate(-50%, -50%)';
  }, 2500);
}

let isDraggingKnife = false;

function initKnifeDrag() {
  const knife = document.getElementById('knife');
  
  knife.addEventListener('mousedown', startDrag);
  knife.addEventListener('touchstart', startDrag, {passive: false});

  function startDrag(e) {
    if (state.cakeCut || !state.candlesBlown) return;
    isDraggingKnife = true;
    knife.style.transition = 'none'; // Follow instantly
    
    document.addEventListener('mousemove', drag);
    document.addEventListener('touchmove', drag, {passive: false});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
    
    drag(e);
  }

  function drag(e) {
    if (!isDraggingKnife) return;
    e.preventDefault(); 
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    knife.style.left = clientX + 'px';
    knife.style.top = clientY + 'px';
    knife.style.transform = 'translate(-50%, -50%) rotate(-45deg)';

    const cyCake = width < 768 ? height * 0.65 : height * 0.68;
    const topActualY = cyCake - 90*scale;
    const bottomActualY = cyCake + 80*scale;
    
    // Check if dragging across center of cake
    if (clientY > topActualY + 20 && clientY < bottomActualY && Math.abs(clientX - width/2) < 60*scale) {
       triggerCut();
    }
  }

  function endDrag() {
    isDraggingKnife = false;
    document.removeEventListener('mousemove', drag);
    document.removeEventListener('touchmove', drag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchend', endDrag);
    
    if (!state.cakeCut) {
      const knife = document.getElementById('knife');
      knife.style.transition = 'top 0.4s ease-in, left 0.4s ease-in, transform 0.4s ease-in, opacity 0.4s ease-out';
      knife.style.left = '50%';
      knife.style.top = '85%';
      knife.style.transform = 'translate(-50%, -50%)';
    }
  }

  function triggerCut() {
    if (state.cakeCut) return;
    state.cakeCut = true;
    isDraggingKnife = false;
    endDrag();
    
    const knife = document.getElementById('knife');
    knife.style.transition = 'all 0.4s ease-out';
    knife.style.opacity = '0';
    
    hintEl.innerHTML = "Make a beautiful wish! ✨";
    hintEl.style.background = "rgba(233, 30, 99, 0.7)";
    
    setTimeout(() => {
      knife.style.display = 'none';
      const wishContainer = document.getElementById("wish-container");
      wishContainer.style.display = "flex";
      void wishContainer.offsetWidth;
      wishContainer.style.opacity = "1";
    }, 400);
  }
}

function initHatDrag() {
  canvas.addEventListener('mousedown', startHatDrag);
  canvas.addEventListener('touchstart', startHatDrag, {passive: false});

  function startHatDrag(e) {
    if (!state.started) return;
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    let hx = partyHat.x;
    let hy = partyHat.y;
    if (partyHat.wearer) {
        if (partyHat.wearer instanceof Cat) { hx = partyHat.wearer.x + 30*scale; hy = partyHat.wearer.y - 65*scale; }
        else if (partyHat.wearer instanceof Stickman) { hx = partyHat.wearer.x; hy = partyHat.wearer.y - partyHat.wearer.jumpY - 95*scale; }
    }

    if (clientX > hx - 40*scale && clientX < hx + 40*scale && clientY > hy - 90*scale && clientY < hy + 20*scale) {
      partyHat.isDragging = true;
      partyHat.wearer = null; 
      partyHat.x = clientX;
      partyHat.y = clientY + 40*scale; 
      
      document.addEventListener('mousemove', dragHat);
      document.addEventListener('touchmove', dragHat, {passive: false});
      document.addEventListener('mouseup', endHatDrag);
      document.addEventListener('touchend', endHatDrag);
      e.preventDefault();
    }
  }

  function dragHat(e) {
    if (!partyHat.isDragging) return;
    e.preventDefault();
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    partyHat.x = clientX;
    partyHat.y = clientY + 40*scale;
  }

  function endHatDrag(e) {
    partyHat.isDragging = false;
    document.removeEventListener('mousemove', dragHat);
    document.removeEventListener('touchmove', dragHat);
    document.removeEventListener('mouseup', endHatDrag);
    document.removeEventListener('touchend', endHatDrag);

    let closestDist = 120 * scale;
    let closestChar = null;
    
    cats.forEach(c => {
       let hx = c.x + 30*scale;
       let hy = c.y - 45*scale;
       let dist = Math.hypot(partyHat.x - hx, (partyHat.y - 40*scale) - hy);
       if(dist < closestDist) { closestDist = dist; closestChar = c; }
    });
    stickmen.forEach(s => {
       let hx = s.x;
       let hy = s.y - s.jumpY - 75*scale;
       let dist = Math.hypot(partyHat.x - hx, (partyHat.y - 40*scale) - hy);
       if(dist < closestDist) { closestDist = dist; closestChar = s; }
    });

    if (closestChar) {
       partyHat.wearer = closestChar;
    }
  }
}

function drawTable(cx, cy, s) {
  const tableY = cy + layerY[0] + 80*s; 
  ctx.fillStyle = '#8b4513';
  ctx.beginPath();
  ctx.ellipse(cx, tableY, 280*s, 60*s, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#5c4033';
  ctx.fillRect(cx - 280*s, tableY, 560*s, 20*s);
  ctx.fillRect(cx - 220*s, tableY + 10*s, 30*s, height);
  ctx.fillRect(cx + 190*s, tableY + 10*s, 30*s, height);
}

function drawHat() {
  const s = scale;
  let hx = partyHat.x;
  let hy = partyHat.y;
  
  if (partyHat.wearer) {
    if (partyHat.wearer instanceof Cat) {
      hx = partyHat.wearer.x + 30*s;
      hy = partyHat.wearer.y - 40*s; 
    } else if (partyHat.wearer instanceof Stickman) {
      hx = partyHat.wearer.x;
      hy = partyHat.wearer.y - partyHat.wearer.jumpY - 70*s;
    }
  }

  ctx.save();
  ctx.translate(hx, hy); 
  ctx.scale(s, s);
  if (partyHat.isDragging) ctx.scale(1.2, 1.2);
  
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath();
  ctx.moveTo(0, -80); 
  ctx.lineTo(35, -30); 
  ctx.lineTo(-35, -30); 
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); 
  ctx.arc(0, -30, 12, 0, Math.PI*2); 
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(-10, -60, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -50, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

class Cat {
  constructor() {
    this.x = -100;
    this.y = height - 50; 
    this.vx = 0.5;
  }
  update() {
    this.x += this.vx;
    if (this.x > width + 100) this.x = -100;
    this.y = height - 50*scale; 
  }
  draw() {
    const s = scale;
    ctx.save();
    ctx.translate(this.x, this.y);
    
    ctx.fillStyle = '#ffb6c1';
    ctx.beginPath();
    ctx.ellipse(0, -20*s, 30*s, 20*s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(30*s, -35*s, 15*s, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(25*s, -48*s); ctx.lineTo(20*s, -60*s); ctx.lineTo(32*s, -48*s);
    ctx.moveTo(35*s, -45*s); ctx.lineTo(45*s, -55*s); ctx.lineTo(42*s, -42*s);
    ctx.fill();
    ctx.strokeStyle = '#ffb6c1';
    ctx.lineWidth = 4*s;
    ctx.beginPath();
    const tailWag = Math.sin(Date.now()/200)*10*s;
    ctx.moveTo(-25*s, -25*s);
    ctx.quadraticCurveTo(-40*s, -40*s + tailWag, -45*s, -50*s + tailWag);
    ctx.stroke();

    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(35*s, -38*s, 2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(42*s, -38*s, 2*s, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffb6c1';
    ctx.lineWidth = 5*s;
    const walk1 = Math.sin(Date.now()/150)*10*s;
    const walk2 = Math.sin(Date.now()/150 + Math.PI)*10*s;
    ctx.beginPath(); ctx.moveTo(-15*s, -5*s); ctx.lineTo(-15*s + walk1, 10*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5*s, -5*s); ctx.lineTo(5*s + walk2, 10*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15*s, -15*s); ctx.lineTo(15*s + walk1, 5*s); ctx.stroke();
    ctx.restore();
  }
}

class Stickman {
  constructor(x) {
    this.x = x;
    this.y = height - 50; 
    this.jumpY = 0;
    this.danceOffset = Math.random() * 1000;
  }
  update() {
    this.y = height - 50*scale;
    if (state.started) {
       this.jumpY = Math.abs(Math.sin((Date.now() + this.danceOffset)/300)) * 40 * scale;
    }
  }
  draw() {
    const s = scale;
    ctx.save();
    ctx.translate(this.x, this.y - this.jumpY);

    // Glow effect so stickmen stand out against the dark background
    ctx.shadowColor = '#ff9ff3';
    ctx.shadowBlur = 12 * s;

    // Head — filled warm skin tone with a bright outline
    ctx.fillStyle = '#ffe0b2';
    ctx.strokeStyle = '#ff9ff3';
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.arc(0, -60 * s, 15 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Face — eyes and smile
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#5c2d00';
    ctx.beginPath(); ctx.arc(-5*s, -62*s, 2.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5*s, -62*s, 2.5*s, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5c2d00';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.arc(0, -58*s, 5*s, 0.1, Math.PI - 0.1);
    ctx.stroke();
    ctx.shadowColor = '#ff9ff3';
    ctx.shadowBlur = 12 * s;

    // Body
    ctx.strokeStyle = '#ff9ff3';
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(0, -45 * s);
    ctx.lineTo(0, -10 * s);
    ctx.stroke();

    // Arms — animated wave
    const armWave = state.started ? Math.sin((Date.now() + this.danceOffset) / 150) * 20 * s : 0;
    ctx.strokeStyle = '#ffe0b2';
    ctx.lineWidth = 3.5 * s;
    ctx.beginPath();
    ctx.moveTo(0, -35 * s);
    ctx.lineTo(-22 * s, -50 * s + armWave);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -35 * s);
    ctx.lineTo(22 * s, -50 * s - armWave);
    ctx.stroke();

    // Legs — animated bend
    const legBend = state.started ? Math.sin((Date.now() + this.danceOffset) / 300) * 10 * s : 0;
    ctx.strokeStyle = '#ff9ff3';
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(0, -10 * s);
    ctx.lineTo(-18 * s - legBend, 22 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -10 * s);
    ctx.lineTo(18 * s + legBend, 22 * s);
    ctx.stroke();

    ctx.restore();
  }
}

/* ===== GIFT BOXES ===== */
let gifts = [];

function initGifts() {
  gifts = [
    {
      // Hot pink box with yellow ribbon
      boxColor:    '#ff4d94',
      boxShade:    '#cc2060',
      ribbonColor: '#ffe44d',
      bowColor:    '#ffd700',
      dotColor:    'rgba(255,255,255,0.25)',
      pattern:     'dots',
      w: 70, h: 60, offsetX: -180, phase: 0
    },
    {
      // Mint green box with white ribbon
      boxColor:    '#4dffc3',
      boxShade:    '#00b386',
      ribbonColor: '#ffffff',
      bowColor:    '#ffffff',
      dotColor:    'rgba(0,180,120,0.3)',
      pattern:     'stripes',
      w: 55, h: 50, offsetX: -260, phase: 1.2
    },
    {
      // Lavender box with pink ribbon
      boxColor:    '#c97bff',
      boxShade:    '#8a2be2',
      ribbonColor: '#ff9ff3',
      bowColor:    '#ff6fcf',
      dotColor:    'rgba(255,255,255,0.2)',
      pattern:     'dots',
      w: 80, h: 65, offsetX: -110, phase: 2.1
    }
  ];
}

function drawGifts() {
  const s = scale;
  // Sit on the table surface — same y reference as drawTable
  const cx    = width / 2;
  const cyCake = (width < 768) ? height * 0.65 : height * 0.68;
  const tableY = cyCake + layerY[0] + 80 * s;   // top of table ellipse

  gifts.forEach(g => {
    const bw = g.w * s;
    const bh = g.h * s;
    // Gentle bob: rises slightly when party starts
    const bob = state.started ? Math.sin((Date.now() / 600) + g.phase) * 4 * s : 0;
    const gx  = cx + g.offsetX * s;
    const gy  = tableY - bh + bob;          // sit on top of table surface

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur  = 10 * s;

    // --- Box body ---
    ctx.fillStyle = g.boxColor;
    ctx.beginPath();
    ctx.roundRect(gx - bw/2, gy, bw, bh, 6 * s);
    ctx.fill();

    // --- Side shade (gives 3-D feel) ---
    ctx.fillStyle = g.boxShade;
    ctx.beginPath();
    ctx.roundRect(gx - bw/2, gy, bw * 0.18, bh, [6*s, 0, 0, 6*s]);
    ctx.fill();

    // --- Pattern on box ---
    ctx.shadowBlur = 0;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(gx - bw/2, gy, bw, bh, 6 * s);
    ctx.clip();
    if (g.pattern === 'dots') {
      ctx.fillStyle = g.dotColor;
      const dotSpacing = 14 * s;
      for (let dx = gx - bw/2 + 10*s; dx < gx + bw/2; dx += dotSpacing) {
        for (let dy = gy + 8*s; dy < gy + bh; dy += dotSpacing) {
          ctx.beginPath();
          ctx.arc(dx, dy, 3 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else {
      // diagonal stripes
      ctx.strokeStyle = g.dotColor;
      ctx.lineWidth = 5 * s;
      for (let i = -bh; i < bw + bh; i += 16 * s) {
        ctx.beginPath();
        ctx.moveTo(gx - bw/2 + i, gy);
        ctx.lineTo(gx - bw/2 + i + bh, gy + bh);
        ctx.stroke();
      }
    }
    ctx.restore();

    // --- Ribbon vertical stripe ---
    ctx.fillStyle = g.ribbonColor;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(gx - 5*s, gy, 10*s, bh);
    ctx.globalAlpha = 1;

    // --- Lid top strip ---
    const lidH = bh * 0.18;
    ctx.fillStyle = g.boxShade;
    ctx.beginPath();
    ctx.roundRect(gx - bw/2, gy, bw, lidH, [6*s, 6*s, 0, 0]);
    ctx.fill();

    // --- Ribbon horizontal on lid ---
    ctx.fillStyle = g.ribbonColor;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(gx - bw/2, gy + lidH * 0.3, bw, lidH * 0.4);
    ctx.globalAlpha = 1;

    // --- Bow (two lobes + knot) ---
    ctx.fillStyle = g.bowColor;
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 4 * s;
    // Left lobe
    ctx.beginPath();
    ctx.ellipse(gx - 10*s, gy - 2*s, 10*s, 7*s, -Math.PI/5, 0, Math.PI*2);
    ctx.fill();
    // Right lobe
    ctx.beginPath();
    ctx.ellipse(gx + 10*s, gy - 2*s, 10*s, 7*s, Math.PI/5, 0, Math.PI*2);
    ctx.fill();
    // Knot circle
    ctx.shadowBlur = 0;
    ctx.fillStyle = g.ribbonColor;
    ctx.beginPath();
    ctx.arc(gx, gy - 1*s, 5*s, 0, Math.PI*2);
    ctx.fill();

    // --- Sparkle star on box ---
    if (state.started) {
      const sparkleAlpha = (Math.sin(Date.now() / 400 + g.phase) + 1) / 2;
      ctx.globalAlpha = sparkleAlpha * 0.9;
      ctx.fillStyle = '#fff';
      const sx = gx + bw * 0.25;
      const sy = gy + bh * 0.55;
      const sr = 4 * s;
      ctx.beginPath();
      for (let p = 0; p < 4; p++) {
        const angle = (p * Math.PI) / 2;
        const ia    = angle + Math.PI / 4;
        ctx.lineTo(sx + Math.cos(angle) * sr, sy + Math.sin(angle) * sr);
        ctx.lineTo(sx + Math.cos(ia) * sr * 0.4, sy + Math.sin(ia) * sr * 0.4);
      }
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  });
}

/* ===== ANIMATE LOOP ===== */
setInterval(() => {
  if(state.started) {
    hearts.push(new Particle('heart'));
    if (Math.random() > 0.6) balloons.push(new Particle('balloon'));
  }
}, 300);

function animate() {
  ctx.clearRect(0,0,width,height);
  
  cats.forEach(c => { c.update(); c.draw(); });
  stickmen.forEach(s => { s.update(); s.draw(); });

  drawGifts();
  drawCake();

  [...hearts, ...confetti, ...smoke, ...balloons].forEach(p => {
    p.update(); p.draw();
  });
  
  if (state.started) {
     drawHat();
  }
  
  hearts = hearts.filter(h => h.y > -50);
  smoke = smoke.filter(s => s.life > 0);
  confetti = confetti.filter(c => c.life > 0);
  balloons = balloons.filter(b => b.life > 0);
  
  if(state.started) requestAnimationFrame(animate);
}
